{% extends 'blog/base.html' %}

{% block title %}
Edit Post
{% endblock %}

{% block content %}

<h2>Edit Post</h2>

<form method="POST" class="form">

    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn" type="submit">
        💾 Update Post
    </button>

    <a class="btn cancel" href="{% url 'post_list' %}">
        Cancel
    </a>

</form>

{% endblock %}
