{% extends "blog/base.html" %}

{% block title %}
{{ post.title }}
{% endblock %}

{% block content %}

<div class="card post-card">

    <h2>{{ post.title }}</h2>

    <p class="meta">
        By <strong>{{ post.author.name }}</strong> |
        {{ post.published_on|date:"F d, Y" }}
    </p>

    <hr>

    <p class="post-body">
        {{ post.body|linebreaks }}
    </p>

    <div class="button-group">

        {% if user.is_authenticated %}
            <a href="{% url 'edit_post' post.id %}" class="btn edit-btn">
                Edit
            </a>

            <a href="{% url 'delete_post' post.id %}" class="btn delete-btn">
                Delete
            </a>
        {% endif %}

        <a href="{% url 'post_list' %}" class="btn cancel">
            Back
        </a>

    </div>

</div>

{% endblock %}
